<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="globe-icon">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path
                        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                    </path>
                </svg>
            </div>
            <h1 id="greeting">Hello World</h1>
            <p>Welcome to your cross-platform experience.</p>
            <button id="installBtn" class="btn" hidden>Install App</button>
            <button id="profileBtn" class="btn secondary-btn">Profile</button>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal" hidden>
        <div class="modal-content card">
            <span id="closeModal" class="close">&times;</span>
            <h2>User Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="birthYear">Birth Year</label>
                    <input type="number" id="birthYear" placeholder="YYYY">
                </div>
                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex">
                        <option value="">Select...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="button-group">
                    <button type="button" id="saveBtn" class="btn">Save Locally</button>
                </div>
                <hr class="divider">
                <h3>Backup & Restore</h3>
                <p class="small-text">Requires Google Cloud Setup</p>
                <div class="button-group">
                    <button type="button" id="backupBtn" class="btn google-btn">Backup to Drive</button>
                    <button type="button" id="restoreBtn" class="btn google-btn">Restore from Drive</button>
                </div>
            </form>
        </div>
    </div>

    <div id="updateToast" class="toast" hidden>
        <p>New version available!</p>
        <button id="updateBtn" class="btn-small">Update</button>
    </div>

    <!-- Google Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <script>
        // --- CONFIGURATION ---
        // TODO: User must replace these with their own from Google Cloud Console
        const CLIENT_ID = 'YOUR_CLIENT_ID_HERE';
        const API_KEY = 'YOUR_API_KEY_HERE';
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        // --- UI Elements ---
        const profileBtn = document.getElementById('profileBtn');
        const profileModal = document.getElementById('profileModal');
        const closeModal = document.getElementById('closeModal');
        const saveBtn = document.getElementById('saveBtn');
        const backupBtn = document.getElementById('backupBtn');
        const restoreBtn = document.getElementById('restoreBtn');
        const greeting = document.getElementById('greeting');

        // --- Local Storage Logic ---
        function loadProfile() {
            const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
            document.getElementById('name').value = profile.name || '';
            document.getElementById('email').value = profile.email || '';
            document.getElementById('birthYear').value = profile.birthYear || '';
            document.getElementById('sex').value = profile.sex || '';

            if (profile.name) {
                greeting.textContent = `Hello ${profile.name}`;
            }
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                birthYear: document.getElementById('birthYear').value,
                sex: document.getElementById('sex').value
            };
            localStorage.setItem('userProfile', JSON.stringify(profile));

            if (profile.name) {
                greeting.textContent = `Hello ${profile.name}`;
            } else {
                greeting.textContent = 'Hello World';
            }

            alert('Profile saved locally!');
        }

        // --- Google Drive Logic ---
        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
            checkAuth();
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined later
            });
            gisInited = true;
            checkAuth();
        }

        function checkAuth() {
            if (gapiInited && gisInited) {
                backupBtn.disabled = false;
                restoreBtn.disabled = false;
            }
        }

        async function handleAuthClick(callback) {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw (resp);
                }
                await callback();
            };
            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        async function backupToDrive() {
            try {
                const profile = localStorage.getItem('userProfile');
                if (!profile) {
                    alert('No profile to backup!');
                    return;
                }

                const fileContent = new Blob([profile], { type: 'application/json' });
                const metadata = {
                    'name': 'hello_world_backup.json',
                    'mimeType': 'application/json',
                };

                const accessToken = gapi.client.getToken().access_token;
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', fileContent);

                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });

                if (response.ok) {
                    alert('Backup successful!');
                } else {
                    throw new Error('Backup failed');
                }

            } catch (err) {
                console.error(err);
                alert('Backup failed. Check console.');
            }
        }

        async function restoreFromDrive() {
            try {
                const response = await gapi.client.drive.files.list({
                    'pageSize': 1,
                    'fields': "nextPageToken, files(id, name)",
                    'q': "name = 'hello_world_backup.json' and trashed = false"
                });

                const files = response.result.files;
                if (files && files.length > 0) {
                    const fileId = files[0].id;
                    const fileResponse = await gapi.client.drive.files.get({
                        fileId: fileId,
                        alt: 'media'
                    });

                    const profile = fileResponse.result;
                    const profileString = typeof profile === 'string' ? profile : JSON.stringify(profile);

                    localStorage.setItem('userProfile', profileString);
                    loadProfile();
                    alert('Restore successful!');
                } else {
                    alert('No backup found.');
                }
            } catch (err) {
                console.error(err);
                alert('Restore failed. Check console.');
            }
        }

        // --- Event Listeners ---
        profileBtn.addEventListener('click', () => {
            profileModal.hidden = false;
            loadProfile();
        });

        closeModal.addEventListener('click', () => {
            profileModal.hidden = true;
        });

        window.addEventListener('click', (e) => {
            if (e.target == profileModal) {
                profileModal.hidden = true;
            }
        });

        saveBtn.addEventListener('click', saveProfile);

        backupBtn.addEventListener('click', () => {
            if (CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
                alert('Please configure CLIENT_ID in index.html first!');
                return;
            }
            handleAuthClick(backupToDrive);
        });

        restoreBtn.addEventListener('click', () => {
            if (CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
                alert('Please configure CLIENT_ID in index.html first!');
                return;
            }
            handleAuthClick(restoreFromDrive);
        });

        // Expose callbacks
        window.gapiLoaded = gapiLoaded;
        window.gisLoaded = gisLoaded;

        // --- Service Worker Logic ---
        let newWorker;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered: ', registration);

                    registration.addEventListener('updatefound', () => {
                        newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showUpdateToast();
                            }
                        });
                    });
                }).catch(registrationError => console.log('SW registration failed: ', registrationError));
            });

            let refreshing;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                window.location.reload();
                refreshing = true;
            });
        }

        function showUpdateToast() {
            const toast = document.getElementById('updateToast');
            toast.hidden = false;
        }

        document.getElementById('updateBtn').addEventListener('click', () => {
            if (newWorker) {
                newWorker.postMessage({ action: 'skipWaiting' });
            }
            document.getElementById('updateToast').hidden = true;
        });

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.hidden = false;
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
            installBtn.hidden = true;
        });

        // Load profile on startup
        loadProfile();
    </script>
    <!-- Update Google Script tags to call callbacks -->
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>
</body>

</html>
